[package]
name = "vault-strategy"
description = "Momentum strategy with sealed parameters; runs in an OutLayer TDX enclave (wasm32-wasip1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "strategy"
path = "src/main.rs"

[dependencies]
vault-proofs = { path = "../crates/proofs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
