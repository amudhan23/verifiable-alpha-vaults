name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests (proofs, contract, strategy, full pipeline)
        run: cargo test --workspace
      - name: Executor tests (offline, incl. full local-enclave cycle)
        run: node executor/test.mjs
      - name: One full offline cycle (enclave -> commit -> reveal -> proof)
        run: node executor/run.mjs --enclave local --vault dry

  wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Add wasm targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - name: Vault contract (NEAR deployable)
        run: RUSTFLAGS="--cfg near -C link-arg=-s" cargo build -p vault-contract --target wasm32-unknown-unknown --release
      - name: Strategy (OutLayer enclave binary) + approved hash
        run: |
          cargo build -p vault-strategy --target wasm32-wasip1 --release
          sha256sum target/wasm32-wasip1/release/strategy.wasm | tee strategy.wasm.sha256
      - name: WASI smoke test (run strategy.wasm exactly as OutLayer does)
        run: |
          pip install wasmtime -q
          python3 scripts/wasi-smoke.py
      - name: Browser proof verifier (Bulletproofs in the browser)
        run: |
          cargo build -p vault-proofs --target wasm32-unknown-unknown --release --features wasm
          curl -sSL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz | tar xz
          ./wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen \
            target/wasm32-unknown-unknown/release/vault_proofs.wasm \
            --out-dir frontend/pkg --target web --no-typescript
          ls -la frontend/pkg
      - name: Verifier smoke test (node runs the wasm against real fixtures)
        run: node scripts/verify-pkg-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            target/wasm32-unknown-unknown/release/vault_contract.wasm
            target/wasm32-wasip1/release/strategy.wasm
            strategy.wasm.sha256
            frontend/pkg/
      - name: Commit the browser verifier into the repo (clean clones verify with zero build)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/pkg strategy.wasm.sha256
          git diff --cached --quiet || { git commit -m "ci: rebuild browser verifier wasm [skip ci]"; git push; }

  pages:
    # Hosted demo. Activates once the repo is public (GitHub Pages on free
    # plans requires a public repo), so it comes alive at submission time.
    needs: wasm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - run: git pull --rebase origin main   # pick up the pkg commit from the wasm job
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
      - id: deployment
        uses: actions/deploy-pages@v4
